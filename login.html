<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/index.css">
  <link rel="stylesheet" href="css/admin.css">
  <link rel="stylesheet" href="css/form.css">
  <link rel="stylesheet" href="css/login.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="icon" href="img/icone-grao.png" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
  <title>Borcelle Cafeteria - Login</title>
</head>
<body>
<main>
  <section class="container-admin-banner">
    <img src="img/logo-grao.png" class="logo-admin" alt="Grão Digital">
    <h1>Login Borcelle</h1>
    <img class= "ornaments" src="img/ornaments-coffee.png" alt="ornaments">
  </section>
  <section class="container-form">
  <form action="login.php" method="post">
    <p id="login-feedback" class="login-feedback" role="alert" hidden>
      E-mail ou senha inválidos. Tente novamente.
    </p>
    <label for="email">E-mail</label>
    <input type="email" id="email" name="email" placeholder="Digite o seu e-mail"
           autocomplete="username" required>

    <label for="password">Senha</label>
    <input type="password" id="password" name="password" placeholder="Digite a sua senha"
           autocomplete="current-password" required>

    <button type="submit" class="botao-cadastrar">Entrar</button>
    <a class="login-setup-link" href="setup-admin.php">Primeiro acesso? Configure o administrador</a>
  </form>

  </section>
</main>
<script>
  if (new URLSearchParams(window.location.search).has('erro')) {
    document.getElementById('login-feedback').hidden = false;
  }
</script>
</body>
</html>
